repository: https://github.com/sybenx/marble
name: Marble
summary: "Beta: a Nostr signer with search, a reader and notes that sync, its key on your phone or shared with your own Keykin box."
description: |
  Beta. Marble is a home for Nostr: search people, posts, articles and apps, read the
  sources you choose, keep notes that sync to all your devices, and sign in to sites and
  apps.

  Your key starts on your phone, sealed, and signs from there; no server is needed. A
  Keykin box is optional: sign in to one and your phone and the box each hold a piece of
  the key, any two pieces sign, and one alone does nothing. The phone keeps the whole key
  as your backup until you choose to forget it. Signing uses the Zcash Foundation's FROST
  crate; Keykin's spec around it is still a draft.

  - Create an account, bring the secret key you have, or move it over from another
    device by scanning one code.
  - Sign in to sites by a scanned code, nostrconnect:// or a bunker:// link. Apps on your
    phone sign through Marble as an Android signer (NIP-55).
  - Each new site gets an account of its own by default, made from your main one. Sites
    get only what you allow: private lists and DMs are switches.
  - Anything hard to undo asks first. An app changing your relay lists asks every time;
    wiping your profile or emptying your follows takes Yes and your fingerprint.
  - Every change to your lists is kept in Recent changes, with Undo.
  - Notes live in an encrypted vault on your own relays and Blossom servers, the same on
    every device and on Marble Web.
  - Take your key out whenever you like.

  Run your own box: https://github.com/sybenx/keykin-umbrel
  How Keykin works: https://github.com/sybenx/keykin
license: MIT
website: https://marble.syb.lol
