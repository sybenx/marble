<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Marble</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  :root { --ground: #f4f4f4; --text: #1d1d1d; --muted: #6b6b6b; --accent: #2f6fdf; }
  @media (prefers-color-scheme: dark) { :root { --ground: #141414; --text: #ececec; --muted: #9a9a9a; --accent: #7aa7ff; } }
  body { margin: 0; background: var(--ground); color: var(--text); font: 17px/1.5 system-ui, sans-serif; }
  main { max-width: 420px; margin: 18vh auto 0; padding: 0 16px; }
  h1 { font-size: 24px; font-weight: 600; margin: 0 0 20px; }
  a.go { display: block; text-align: center; padding: 14px; border-radius: 12px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; }
  p { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Signing in to Marble</h1>
  <a class="go" id="go" hidden>Open Marble</a>
  <p id="other" hidden>Go back to Marble.</p>
</main>
<script>
// Marble on Android's "Use my name" sign-in comes back here (Keykin SPEC 11.6): the account page puts the approval
// code, the state and the join text in this page's fragment, which the browser never sends to the server. When
// Android hands this address to the app, this page never loads. When it does load, a tap opens the app with the same
// three. The code alone is worth nothing: the app also needs its PKCE verifier, which never left it.
(() => {
  const q = new URLSearchParams(location.hash.slice(1));
  history.replaceState(null, "", location.pathname);
  const keep = new URLSearchParams();
  for (const k of ["code", "state", "join"]) if (q.get(k)) keep.set(k, q.get(k));
  if (!keep.get("code") || !/android/i.test(navigator.userAgent)) { document.getElementById("other").hidden = false; return; }
  const go = document.getElementById("go");
  go.href = `intent://joined?${keep}#Intent;scheme=marble;package=cc.aaro.cosign;end`;
  go.hidden = false;
})();
</script>
</body>
</html>
