# The old way marble.syb.lol was published: site/ to GitHub Pages. Since 2026-11-03 marble.syb.lol is the Cloudflare
# Worker (wrangler.jsonc: `npx wrangler deploy`), which answers every page with 200 (Pages answered links like
# /nevent1… with 404, so browsers offered the Internet Archive). Kept, by hand only, in case it's needed back.
name: Site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Links like /e/<post> and /p/<person> have no file of their own: Pages answers them with 404.html,
      # which is the same page, and the page opens what the link names.
      - run: cp site/index.html site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
