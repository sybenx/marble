# Publishes site/ to GitHub Pages (https://marble.syb.lol, the custom domain set in the repo's Pages settings;
# sybenx.github.io/marble redirects there) when it changes on main.
name: Site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Links like /e/<post> and /p/<person> have no file of their own: Pages answers them with 404.html,
      # which is the same page, and the page opens what the link names.
      - run: cp site/index.html site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
